<title>Time Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap">
<style>
/* Layout: toolbar (view switch, date nav), then one big surface that is either an hourly day grid or a month grid. */
:root{
  --bg:#faf6fc; --surface:#ffffff; --surface2:#f5eefa; --ink:#3b3249; --muted:#7c7290; --line:#eadff2; --line2:#f3ecf8;
  --accent:#9a7fd6; --accent-ink:#ffffff; --accent-soft:#e9defa; --focus:#6f55b8; --now:#e0577b;
  --lav-bg:#e4d9fb; --lav-fg:#5a3fa0; --rose-bg:#fbd3df; --rose-fg:#9d3a5a; --mint-bg:#cfeadb; --mint-fg:#2d6a4a;
  --peach-bg:#fde0c6; --peach-fg:#935217; --sky-bg:#cde5f7; --sky-fg:#27608f; --sun-bg:#f7ecb8; --sun-fg:#7a6212;
  --shadow:0 1px 2px rgba(90,63,160,.06),0 8px 24px rgba(90,63,160,.06);
  --font-display:'Fraunces',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif; --hh:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1824; --surface:#262031; --surface2:#2f2840; --ink:#f0eaf8; --muted:#a79cbb; --line:#3a3250; --line2:#302a42;
  --accent:#b69cf0; --accent-ink:#1c1824; --accent-soft:#3b3257; --focus:#cdbcff; --now:#ff8aa8;
  --lav-bg:#43376b; --lav-fg:#dccfff; --rose-bg:#613248; --rose-fg:#ffd0de; --mint-bg:#2c4f3d; --mint-fg:#c4f0d6;
  --peach-bg:#684425; --peach-fg:#ffdcbb; --sky-bg:#2b4a66; --sky-fg:#c6e4fb; --sun-bg:#5c4f1c; --sun-fg:#f5e6a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1824; --surface:#262031; --surface2:#2f2840; --ink:#f0eaf8; --muted:#a79cbb; --line:#3a3250; --line2:#302a42;
  --accent:#b69cf0; --accent-ink:#1c1824; --accent-soft:#3b3257; --focus:#cdbcff; --now:#ff8aa8;
  --lav-bg:#43376b; --lav-fg:#dccfff; --rose-bg:#613248; --rose-fg:#ffd0de; --mint-bg:#2c4f3d; --mint-fg:#c4f0d6;
  --peach-bg:#684425; --peach-fg:#ffdcbb; --sky-bg:#2b4a66; --sky-fg:#c6e4fb; --sun-bg:#5c4f1c; --sun-fg:#f5e6a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,38px);line-height:1.1}
h1 em{color:var(--accent);font-style:italic}
h2{font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:500;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--rose-fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 16px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon{width:36px;padding:7px 0;text-align:center}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:10px 16px;font-size:14px}
.banner[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;padding:16px 20px;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}

/* Day grid */
.scroll{max-height:min(74vh,780px);overflow-y:auto;position:relative}
.tg{display:grid;grid-template-columns:62px minmax(0,1fr);padding-right:12px}
.gut{position:relative}
.hl{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.col{position:relative;cursor:cell;touch-action:pan-y;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hh)),
                   repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh)/2),var(--line2) calc(var(--hh)/2),var(--line2) calc(var(--hh)/2 + 1px),transparent calc(var(--hh)/2 + 1px),transparent var(--hh))}
.blk{position:absolute;border-radius:10px;padding:4px 8px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:13px;line-height:1.3;border:1px solid var(--surface)}
.blk:active{cursor:grabbing}
.blk .bt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bm{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.short{display:flex;gap:8px;align-items:center;padding-top:0;padding-bottom:0}
.blk.short .bm{display:none}
.rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.rz::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;border-radius:2px;background:currentColor;opacity:.35;transform:translateX(-50%)}
.sel{position:absolute;left:2px;right:2px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);pointer-events:none;font-size:12px;padding:2px 8px;color:var(--focus)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.c-lav{background:var(--lav-bg);color:var(--lav-fg)}.c-rose{background:var(--rose-bg);color:var(--rose-fg)}.c-mint{background:var(--mint-bg);color:var(--mint-fg)}
.c-peach{background:var(--peach-bg);color:var(--peach-fg)}.c-sky{background:var(--sky-bg);color:var(--sky-fg)}.c-sun{background:var(--sun-bg);color:var(--sun-fg)}

/* Month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px 16px 20px}
.dow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{min-height:108px;background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.cell:hover{border-color:var(--accent)}
.cell.out{background:transparent;border:1px dashed var(--line);opacity:.55}
.cell .n{font-size:12px;font-weight:500;color:var(--muted);min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;align-self:flex-start;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--accent);color:var(--accent-ink)}
.chip{border-radius:8px;padding:2px 6px;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:640px){
  .mgrid{gap:3px;padding:10px 8px 14px}
  .cell{min-height:56px;padding:4px;align-items:center}.cell .n{align-self:center}
  .chip{height:7px;padding:0;font-size:0;border-radius:4px;width:100%}.more{display:none}
  .tg{grid-template-columns:50px minmax(0,1fr)}
}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(40,28,60,.45);display:grid;place-items:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:22px;padding:22px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.frow2{grid-template-columns:1fr}}
@media (max-width:420px){.frow{grid-template-columns:1fr 1fr}.frow label:first-child{grid-column:1/-1}}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);padding:0;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.fact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.err{color:var(--rose-fg);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <div>
      <div class="eyebrow">Planner</div>
      <h1>Time <em>Blocks</em></h1>
    </div>
    <div class="grp">
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-act="mode" data-m="day" id="m-day">Day</button>
        <button type="button" data-act="mode" data-m="month" id="m-month">Month</button>
      </div>
      <button class="btn primary" type="button" data-act="new">+ New block</button>
    </div>
  </header>

  <div class="banner" id="sample-banner" hidden>
    <span>These are sample blocks so you can see how it works. Drag, resize and edit them, or clear them and start fresh.</span>
    <button class="btn" type="button" data-act="clear-sample">Clear samples</button>
  </div>
  <div class="banner" id="status-note" hidden></div>

  <div class="bar">
    <div class="grp">
      <button class="btn icon" type="button" data-act="prev" aria-label="Previous">‹</button>
      <button class="btn" type="button" data-act="today">Today</button>
      <button class="btn icon" type="button" data-act="next" aria-label="Next">›</button>
    </div>
    <h2 id="title"></h2>
    <div class="hint" id="hint"></div>
  </div>

  <section class="card" id="stage" aria-label="Schedule">
    <div id="day"></div>
    <div id="month" hidden></div>
  </section>
</div>

<div class="ov" id="ov" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const COLORS={lav:'Lavender',rose:'Rose',mint:'Mint',peach:'Peach',sky:'Sky',sun:'Butter'};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const H=56, SNAP=15, MINLEN=15;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const now0=new Date(), TODAY=iso(now0);
const mm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const fmt=m=>{const h=Math.floor(m/60)%24,mi=m%60;return (h%12||12)+(mi?':'+pad(mi):'')+' '+(h<12?'AM':'PM')};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'h':'')+(h&&r?' ':'')+(r?r+'m':'')||'0m'};
const longDate=s=>parse(s).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const strip=o=>{const c={...o};delete c.id;return c};
const REP={none:'Does not repeat',daily:'Every day',weekdays:'Every weekday (Mon–Fri)',weekly:'Every week'};
const isRep=b=>b.repeat&&b.repeat!=='none';
const onDay=(b,k)=>{if(!isRep(b))return b.date===k;if(k<b.date||(b.until&&k>b.until)||(b.skip||[]).includes(k))return false;const w=parse(k).getDay();return b.repeat==='daily'||(b.repeat==='weekdays'&&w>0&&w<6)||(b.repeat==='weekly'&&w===parse(b.date).getDay())};

let db=null, blocks=[], mode='day', cur=TODAY, drag=false, pending=false, needScroll=true;

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function showNote(t){const n=$('status-note');n.textContent=t;n.hidden=!t}
async function saveBlock(id,rec){
  if(!db){toast('Saving is unavailable here. Open the page signed in to keep changes.');return false}
  try{ if(id) await db.collection('blocks').doc(id).set(rec); else await db.collection('blocks').add(rec); return true }
  catch(e){toast('Could not save: '+(e&&e.message||'try again'));return false}
}
async function removeBlock(id){
  if(!db)return false;
  try{await db.collection('blocks').doc(id).delete();return true}catch(e){toast('Could not delete: '+(e&&e.message||'try again'));return false}
}

/* ---------- layout of overlapping blocks ---------- */
function layout(list){
  const s=list.map(b=>({...b})).sort((a,b)=>a.start-b.start||a.end-b.end);
  let cluster=[],cEnd=0;
  const flush=()=>{ if(!cluster.length)return; const cols=[];
    cluster.forEach(b=>{let i=cols.findIndex(e=>e<=b.start); if(i<0){i=cols.length;cols.push(0)} cols[i]=b.end; b._c=i});
    cluster.forEach(b=>b._n=cols.length); cluster=[]};
  s.forEach(b=>{ if(cluster.length&&b.start>=cEnd)flush(); cluster.push(b); cEnd=cluster.length===1?b.end:Math.max(cEnd,b.end)});
  flush(); return s;
}

/* ---------- render ---------- */
function renderAll(){
  if(drag){pending=true;return}
  pending=false;
  $('m-day').setAttribute('aria-pressed',mode==='day');$('m-month').setAttribute('aria-pressed',mode==='month');
  $('day').hidden=mode!=='day';$('month').hidden=mode!=='month';
  $('sample-banner').hidden=!blocks.some(b=>b.sample);
  if(mode==='day')renderDay();else renderMonth();
}
function renderDay(){
  $('title').textContent=(cur===TODAY?'Today · ':'')+longDate(cur);
  const bs=blocks.filter(b=>onDay(b,cur)), total=bs.reduce((a,b)=>a+(b.end-b.start),0);
  $('hint').textContent=bs.length?bs.length+' block'+(bs.length>1?'s':'')+' · '+dur(total)+' planned':'Nothing planned yet';
  const old=$('scroll'), keep=old?old.scrollTop:null;
  let labels='';for(let i=1;i<24;i++)labels+=`<div class="hl" style="top:${i*H}px">${fmt(i*60)}</div>`;
  const nm=now0.getHours()*60+new Date().getMinutes();
  const blk=layout(bs).map(b=>`<div class="blk c-${esc(b.color)}${b.end-b.start<=30?' short':''}" role="button" tabindex="0" data-id="${esc(b.id)}" aria-label="${esc(b.title)}, ${fmt(b.start)} to ${fmt(b.end)}" style="top:${b.start/60*H}px;height:${Math.max(14,(b.end-b.start)/60*H-2)}px;left:calc(${b._c*100/b._n}% + 2px);width:calc(${100/b._n}% - 4px)"><div class="bt">${isRep(b)?'↻ ':''}${esc(b.title)}</div><div class="bm">${fmt(b.start)} – ${fmt(b.end)}</div><span class="rz" aria-hidden="true"></span></div>`).join('');
  $('day').innerHTML=`<div class="dayhead"><span class="hint">Drag on an empty slot to block time. Drag a block to move it, pull its bottom edge to resize, click it to edit.</span></div>
    <div class="scroll" id="scroll"><div class="tg"><div class="gut" style="height:${24*H}px">${labels}</div><div class="col" id="col" style="height:${24*H}px">${cur===TODAY?`<div class="now" id="nowline" style="top:${nm/60*H}px"></div>`:''}${blk}</div></div></div>`;
  const sc=$('scroll');
  if(needScroll){const first=bs.length?Math.min(...bs.map(b=>b.start)):(cur===TODAY?Math.max(0,nm-90):7*60);sc.scrollTop=Math.max(0,first/60*H-16);needScroll=false}
  else if(keep!=null)sc.scrollTop=keep;
}
function renderMonth(){
  const d=parse(cur),y=d.getFullYear(),m=d.getMonth();
  $('title').textContent=MONTHS[m]+' '+y;
  const mb=[];for(let dd=1;dd<=new Date(y,m+1,0).getDate();dd++){const k=y+'-'+pad(m+1)+'-'+pad(dd);blocks.forEach(b=>{if(onDay(b,k))mb.push(b)})}
  $('hint').textContent=mb.length?mb.length+' block'+(mb.length>1?'s':'')+' · '+dur(mb.reduce((a,b)=>a+(b.end-b.start),0)):'No blocks this month';
  const off=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), total=Math.ceil((off+days)/7)*7;
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<total;i++){
    const dt=new Date(y,m,1-off+i), k=iso(dt), out=dt.getMonth()!==m;
    const ps=blocks.filter(b=>onDay(b,k)).sort((a,b)=>a.start-b.start);
    h+=`<div class="cell${out?' out':''}${k===TODAY?' today':''}" role="button" tabindex="0" data-date="${k}" aria-label="${esc(longDate(k))}, ${ps.length} blocks"><span class="n">${dt.getDate()}</span>${ps.slice(0,3).map(b=>`<div class="chip c-${esc(b.color)}" data-id="${esc(b.id)}" title="${esc(b.title)} · ${fmt(b.start)} – ${fmt(b.end)}">${fmt(b.start).replace(' ','').toLowerCase()} ${isRep(b)?'↻ ':''}${esc(b.title)}</div>`).join('')}${ps.length>3?`<span class="more">+${ps.length-3} more</span>`:''}</div>`;
  }
  $('month').innerHTML=`<div class="mgrid">${h}</div>`;
}
setInterval(()=>{const n=$('nowline');if(n&&!drag){const t=new Date();n.style.top=(t.getHours()*60+t.getMinutes())/60*H+'px'}},60000);

/* ---------- modal ---------- */
function openModal(html){$('modal').innerHTML=html;$('ov').hidden=false;const f=$('modal').querySelector('input[type=text]');if(f)f.focus()}
function closeModal(){$('ov').hidden=true;$('modal').innerHTML=''}
$('ov').addEventListener('mousedown',e=>{if(e.target===$('ov'))closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('ov').hidden)closeModal();
  if((e.key==='Enter'||e.key===' ')&&$('ov').hidden){const t=e.target;
    if(t.classList&&t.classList.contains('blk')){e.preventDefault();const b=blocks.find(x=>x.id===t.dataset.id);if(b)openForm(b)}
    else if(t.classList&&t.classList.contains('cell')){e.preventDefault();goDay(t.dataset.date)}}});

function openForm(b,occ){
  const isNew=!b.id; let color=b.color||'lav'; occ=occ||cur;
  openModal(`<h2 id="mt">${isNew?'New time block':'Edit time block'}</h2>
  <form id="f">
    <label>What is it<input type="text" name="title" value="${esc(b.title||'')}" placeholder="Deep work, gym, call…" required></label>
    <div class="frow"><label>Date<input type="date" name="date" value="${esc(b.date||cur)}" required></label>
      <label>Start<input type="time" name="start" step="900" value="${mm(b.start)}" required></label>
      <label>End<input type="time" name="end" step="900" value="${mm(b.end)}" required></label></div>
    <div class="frow2"><label>Repeat<select name="repeat" id="rep">${Object.entries(REP).map(([k,v])=>`<option value="${k}"${k===(b.repeat||'none')?' selected':''}>${v}</option>`).join('')}</select></label>
      <label id="untilw"${isRep(b)?'':' hidden'}>Repeat until (optional)<input type="date" name="until" value="${esc(b.until||'')}"></label></div>
    <div><div class="hint" style="margin-bottom:6px">Colour</div><div class="sws" id="sws">${Object.entries(COLORS).map(([k,v])=>`<button type="button" class="sw c-${k}" data-c="${k}" aria-label="${v}" aria-pressed="${k===color}"></button>`).join('')}</div></div>
    <label>Notes<textarea name="notes" rows="3">${esc(b.notes||'')}</textarea></label>
    <div class="err" id="err" role="alert"></div>
    <div class="fact">${isNew?'':`<button type="button" class="btn danger" id="del">${isRep(b)?'Delete all':'Delete'}</button>`}${!isNew&&isRep(b)?'<button type="button" class="btn" id="skip">Skip this day</button>':''}<button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>`);
  $('sws').addEventListener('click',e=>{const s=e.target.closest('.sw');if(!s)return;color=s.dataset.c;$('sws').querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===s))});
  $('cancel').onclick=closeModal;
  $('rep').onchange=()=>{$('untilw').hidden=$('rep').value==='none'};
  if($('skip'))$('skip').onclick=async()=>{if(await saveBlock(b.id,{...strip(b),skip:[...(b.skip||[]),occ]})){closeModal();toast('Skipped '+longDate(occ))}};
  if(!isNew)$('del').onclick=async()=>{if(await removeBlock(b.id)){closeModal();toast('Block deleted')}};
  $('f').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    const s=toMin(d.start),en=toMin(d.end);
    if(en<=s){$('err').textContent='The end time needs to be after the start time.';return}
    if(d.repeat!=='none'&&d.until&&d.until<d.date){$('err').textContent='The repeat end date needs to be on or after the start date.';return}
    const rec={title:d.title.trim(),date:d.date,start:s,end:en,color,notes:d.notes,repeat:d.repeat,until:d.repeat==='none'?'':(d.until||''),skip:b.skip||[],sample:false,created:b.created||Date.now()};
    if(await saveBlock(b.id,rec)){cur=rec.date;closeModal();renderAll();toast('Saved')}});
}
function openNew(start,end,date){openForm({date:date||cur,start:Math.max(0,Math.min(start,1440-MINLEN)),end:Math.min(1440,Math.max(end,start+MINLEN))})}

/* ---------- day grid interaction ---------- */
function endDrag(){drag=false;if(pending)renderAll()}
$('day').addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const be=e.target.closest('.blk');
  if(be)return startBlockDrag(e,be);
  const col=e.target.closest('.col');
  if(col)startCreate(e,col);
});
function startCreate(e,col){
  const id=e.pointerId,touch=e.pointerType==='touch',sx=e.clientX,sy=e.clientY;
  const at=y=>Math.max(0,Math.min(1440,(y-col.getBoundingClientRect().top)/H*60));
  const a=Math.floor(at(sy)/SNAP)*SNAP; let s=a,en=a+60,sel=null,moved=false;
  drag=true;
  const move=ev=>{
    if(ev.pointerId!==id)return;
    if(touch){if(Math.abs(ev.clientY-sy)>8||Math.abs(ev.clientX-sx)>8)moved=true;return}
    if(!sel&&Math.abs(ev.clientY-sy)>4){moved=true;sel=document.createElement('div');sel.className='sel';col.appendChild(sel)}
    if(sel){const cs=Math.floor(at(ev.clientY)/SNAP)*SNAP;s=Math.min(a,cs);en=Math.min(1440,Math.max(a+SNAP,cs+SNAP));
      sel.style.top=s/60*H+'px';sel.style.height=(en-s)/60*H+'px';sel.textContent=fmt(s)+' – '+fmt(en)}
  };
  const clean=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);if(sel)sel.remove()};
  const up=ev=>{if(ev.pointerId!==id)return;clean();endDrag();
    if(touch&&moved)return;
    if(sel||!moved)openNew(s,en)};
  const cancel=ev=>{if(ev.pointerId!==id)return;clean();endDrag()};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);
}
function startBlockDrag(e,el){
  const b=blocks.find(x=>x.id===el.dataset.id);if(!b)return;
  const id=e.pointerId,sy=e.clientY,resize=!!e.target.closest('.rz'),len=b.end-b.start;
  let s=b.start,en=b.end,moved=false;drag=true;
  if(e.pointerType==='mouse')e.preventDefault();
  const move=ev=>{
    if(ev.pointerId!==id)return;
    if(Math.abs(ev.clientY-sy)>4)moved=true;
    if(!moved)return;
    const d=Math.round((ev.clientY-sy)/H*60/SNAP)*SNAP;
    if(resize){s=b.start;en=Math.max(b.start+MINLEN,Math.min(1440,b.end+d))}
    else{s=Math.max(0,Math.min(1440-len,b.start+d));en=s+len}
    el.style.top=s/60*H+'px';el.style.height=Math.max(14,(en-s)/60*H-2)+'px';
    const m=el.querySelector('.bm');if(m)m.textContent=fmt(s)+' – '+fmt(en);
  };
  const clean=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
  const up=async ev=>{
    if(ev.pointerId!==id)return;clean();
    if(!moved){endDrag();openForm(b);return}
    if(s!==b.start||en!==b.end)await saveBlock(b.id,{...strip(b),start:s,end:en,sample:b.sample});
    endDrag();renderAll();
  };
  const cancel=ev=>{if(ev.pointerId!==id)return;clean();endDrag();renderAll()};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);
}

/* ---------- month interaction & toolbar ---------- */
function goDay(date){cur=date;mode='day';needScroll=true;renderAll()}
$('month').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){const b=blocks.find(x=>x.id===chip.dataset.id);if(b)openForm(b,chip.closest('.cell').dataset.date);return}
  const cell=e.target.closest('.cell');if(cell)goDay(cell.dataset.date);
});
function shiftMonth(n){const d=parse(cur),t=new Date(d.getFullYear(),d.getMonth()+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),last));cur=iso(t)}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='mode'){mode=el.dataset.m;needScroll=true;return renderAll()}
  if(a==='prev'){if(mode==='day'){cur=addDays(cur,-1);needScroll=true}else shiftMonth(-1);return renderAll()}
  if(a==='next'){if(mode==='day'){cur=addDays(cur,1);needScroll=true}else shiftMonth(1);return renderAll()}
  if(a==='today'){cur=TODAY;needScroll=true;return renderAll()}
  if(a==='new'){const t=new Date(),h=cur===TODAY?Math.min(t.getHours()+1,22):9;return openNew(h*60,h*60+60)}
  if(a==='clear-sample'){await Promise.all(blocks.filter(b=>b.sample).map(b=>removeBlock(b.id)));toast('Sample blocks cleared')}
});

/* ---------- boot ---------- */
renderAll();
(async()=>{
  const c=window.claude;if(!c||!c.use){showNote('Open this page in Claude to save your schedule.');return}
  db=await c.use('db');
  if(!db){showNote('Sign in to load and save your schedule.');return}
  const timer=setTimeout(()=>showNote('Still loading your schedule. If this stays, the data may be out of date.'),10000);
  db.collection('blocks').onSnapshot(s=>{clearTimeout(timer);showNote('');blocks=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},
    e=>{clearTimeout(timer);showNote('Live updates stopped ('+(e&&e.code||'error')+'). Reload to reconnect.')});
})();
})();
</script>
